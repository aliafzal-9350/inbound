# Production stack. Database is Supabase (DATABASE_URL in .env) - no local Postgres.
# Only nginx is reachable from outside; everything else is on the internal network
# (backend/QR are also bound to 127.0.0.1 on the host for debugging with curl).
services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF=nginx.http.conf until the Let's Encrypt cert exists (see deploy/deploy.sh)
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: always
    mem_limit: 150m
    depends_on:
      - backend-api
      - frontend

  backend-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*
    env_file: .env
    environment:
      # Container-network addresses; override whatever localhost values .env has for local dev.
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_QR_SERVICE_URL=http://whatsapp-qr-service:3001
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    mem_limit: 600m

  celery-worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_QR_SERVICE_URL=http://whatsapp-qr-service:3001
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 500m

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 350mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    mem_limit: 450m

  whatsapp-qr-service:
    build: ./whatsapp-qr-service
    env_file: ./whatsapp-qr-service/.env
    environment:
      - BACKEND_URL=http://backend-api:8000
    volumes:
      - qr_sessions:/app/sessions
    depends_on:
      - backend-api
    ports:
      - "127.0.0.1:3001:3001"
    restart: always
    mem_limit: 300m

  frontend:
    build:
      context: ./frontend
      args:
        # Empty -> production build calls same-origin /api (proxied by nginx-proxy)
        VITE_API_URL: ${PUBLIC_API_URL:-}
    restart: always
    mem_limit: 100m

volumes:
  redisdata:
  qr_sessions:
