# Bootstrap config: plain HTTP only. Used until the Let's Encrypt cert for
# tryravisn.com exists (nginx refuses to start if ssl_certificate files are missing).
# deploy/deploy.sh switches to nginx.conf automatically once the cert is issued.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    # Compress text assets - the JS bundle is ~360KB raw, ~1/3 of that gzipped
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    upstream backend {
        server backend-api:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name tryravisn.com www.tryravisn.com _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        location /webhooks/ {
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
